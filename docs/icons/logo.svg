<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1508"/>
      <stop offset="100%" stop-color="#262010"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg)" stroke="url(#glow)" stroke-width="6" filter="url(#shadow)"/>

  <!-- PlanGML 4-Quadrant Official Zoning Color Matrix -->
  <!-- Top Left: Residential (Yellow #ffcc00) -->
  <polygon points="256,90 380,160 256,230 132,160" fill="#ffcc00" opacity="0.85" stroke="#ffffff" stroke-width="2"/>
  <!-- Top Right: Commercial (Red #ef4444) -->
  <polygon points="256,230 380,160 380,300 256,370" fill="#ef4444" opacity="0.85" stroke="#ffffff" stroke-width="2"/>
  <!-- Bottom Left: Parks / Greenery (Green #22c55e) -->
  <polygon points="132,160 256,230 256,370 132,300" fill="#22c55e" opacity="0.85" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Netcad Binary 'N' Monogram Overlay -->
  <path d="M210 160 L210 300 L302 160 L302 300" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Badge -->
  <rect x="156" y="405" width="200" height="42" rx="21" fill="#0f172a" stroke="url(#glow)" stroke-width="3"/>
  <text x="256" y="432" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="17" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1.5">PLANGML &middot; E-PLAN</text>
</svg>